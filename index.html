<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Notas</title>
</head>
<body>

  <h2>Sistema de Notas</h2>

  <label>Nome do aluno:</label><br />
  <input type="text" id="nome" /><br /><br />

  <label>Nota 1:</label><br />
  <input type="number" id="nota1" /><br /><br />

  <label>Nota 2:</label><br />
  <input type="number" id="nota2" /><br /><br />

  <label>Nota 3:</label><br />
  <input type="number" id="nota3" /><br /><br />

  <button onclick="calcular()">Calcular</button>

  <br /><br />
  <p id="resultado"></p>

  <script>
    function calcular() {
      var nome  = document.getElementById("nome").value;
      var nota1 = parseFloat(document.getElementById("nota1").value);
      var nota2 = parseFloat(document.getElementById("nota2").value);
      var nota3 = parseFloat(document.getElementById("nota3").value);
      var media = (nota1 + nota2 + nota3) / 3;
      var status = media >= 7 ? "Aprovado" : "Recuperação";

      document.getElementById("resultado").innerHTML =
        "Aluno: " + nome + "<br>" +
        "Média: " + media.toFixed(2) + "<br>" +
        "Situação: " + status;
    }
  </script>

</body>
</html>
